<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EUDR Compliance — {% block title %}Dashboard{% endblock %}</title>

    <meta name="shopify-api-key" content="{{ SHOPIFY_API_KEY }}" />
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/@shopify/polaris@13/build/esm/styles.css">
    <script type="module">
        import 'https://cdn.shopify.com/shopifycloud/web-components/polaris.js';
    </script>

    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'San Francisco', 'Segoe UI', Roboto, sans-serif; background-color: #f6f6f7; }
        .app-wrapper { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .metric-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .metric-card h3 { margin: 0 0 4px; font-size: 13px; color: #6d7175; font-weight: 500; }
        .metric-card .value { font-size: 28px; font-weight: 600; color: #202223; }
        .metric-card .value.good { color: #008060; }
        .metric-card .value.warning { color: #b98900; }
        .metric-card .value.danger { color: #d72c0d; }
        .nav-tabs { display: flex; gap: 4px; background: white; padding: 4px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); flex-wrap: wrap; }
        .nav-tabs a { padding: 8px 16px; border-radius: 8px; text-decoration: none; color: #6d7175; font-size: 14px; font-weight: 500; }
        .nav-tabs a.active { background: #008060; color: white; }
        .nav-tabs a:hover:not(.active) { background: #f1f1f1; }
        .content-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); margin-bottom: 16px; }
        .content-card h2 { margin: 0 0 16px; font-size: 16px; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        table th { text-align: left; padding: 8px 12px; font-size: 12px; color: #6d7175; font-weight: 500; border-bottom: 1px solid #e1e3e5; }
        table td { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #f1f1f1; }
        .btn { display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; border: none; }
        .btn-primary { background: #008060; color: white; }
        .btn-primary:hover { background: #006e52; }
        .btn-outline { background: white; color: #202223; border: 1px solid #c9cccf; }
        .btn-outline:hover { background: #f6f6f7; }
        .btn-danger { background: #d72c0d; color: white; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: 500; }
        .badge-compliant, .badge-verified, .badge-submitted { background: #aee9d1; color: #0c5132; }
        .badge-non_compliant, .badge-rejected, .badge-draft { background: #fed3d1; color: #8e1f0b; }
        .badge-in_scope { background: #dfe3fb; color: #3b5998; }
        .badge-low { background: #aee9d1; color: #0c5132; }
        .badge-standard { background: #ffd79d; color: #7c5e00; }
        .badge-high { background: #fed3d1; color: #8e1f0b; }
        .badge-withdrawn { background: #e4e5e7; color: #6d7175; }
        label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 4px; color: #202223; }
        input, select, textarea { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #c9cccf; border-radius: 6px; font-size: 14px; font-family: inherit; }
        textarea { min-height: 80px; resize: vertical; }
        .form-row { margin-bottom: 14px; }
        .form-row-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h1 style="margin: 0; font-size: 22px; font-weight: 600;">EUDR Compliance Suite</h1>
            {% if shop %}
            <span style="font-size: 13px; color: #6d7175;">{{ shop.store_name|default:shop.shopify_domain }}</span>
            {% endif %}
        </div>

        {% if shop %}
        <nav class="nav-tabs">
            <a href="/?shop={{ shop.shopify_domain }}" class="{% if active_tab == 'dashboard' or not active_tab %}active{% endif %}">Dashboard</a>
            <a href="/products?shop={{ shop.shopify_domain }}" class="{% if active_tab == 'products' %}active{% endif %}">Products</a>
            <a href="/plots?shop={{ shop.shopify_domain }}" class="{% if active_tab == 'plots' %}active{% endif %}">Plots</a>
            <a href="/dds?shop={{ shop.shopify_domain }}" class="{% if active_tab == 'dds' %}active{% endif %}">DDS</a>
            <a href="/compliance?shop={{ shop.shopify_domain }}" class="{% if active_tab == 'compliance' %}active{% endif %}">Compliance</a>
            <a href="/api-tokens?shop={{ shop.shopify_domain }}" class="{% if active_tab == 'api' %}active{% endif %}">API</a>
            <a href="/settings?shop={{ shop.shopify_domain }}" class="{% if active_tab == 'settings' %}active{% endif %}">Settings</a>
        </nav>
        {% endif %}

        {% block content %}{% endblock %}
    </div>

    <script>
        (async function() {
            if (!window.shopify) return;
            const originalFetch = window.fetch;
            window.fetch = async function(input, init) {
                init = init || {};
                let url;
                try { url = new URL(typeof input === "string" ? input : input.url, window.location.origin); }
                catch (e) { return originalFetch(input, init); }
                if (url.origin === window.location.origin) {
                    try {
                        const token = await shopify.idToken();
                        if (token) {
                            const headers = new Headers(init.headers || {});
                            headers.set("Authorization", "Bearer " + token);
                            init.headers = headers;
                        }
                    } catch (e) { /* fall through */ }
                }
                return originalFetch(input, init);
            };
            try { shopify.loading(false); } catch(e) {}
        })();
    </script>
</body>
</html>
